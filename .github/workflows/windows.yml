name: Windows x64 verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Test and publish
        run: ./tools/Build-Release.ps1 -BuildOnly
